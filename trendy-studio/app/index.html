<title>TRENDY STUDIO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: ganzes Fenster als DAW. Oben Transport, Mitte Arrangement oder Mischpult, unten Gerät + Clip-Editor.
   Optik: flach und zweidimensional wie die erste Ableton-Version. Keine Schatten, keine Verläufe, 1-px-Linien, warmes Hellgrau, Orange als Akzent. */
:root {
  --bg: #c4c4bb; --panel: #d6d6ce; --lane: #b9b9b0; --lane2: #b0b0a7; --field: #ececE6; --line: #8a8a81; --hair: #a3a39a;
  --ink: #1c1c1a; --dim: #5a5a53; --accent: #ff9419; --sel: #ffe14d; --play: #1c1c1a;
  --mG: #4fbf4a; --mY: #e6d038; --mR: #e8432b;
  --font: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--ink); }
body { margin: 0; font: 12px/1.25 var(--font); overflow: hidden; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 2px 8px; cursor: pointer; height: 22px; white-space: nowrap; }
button:hover { background: var(--field); }
button.on { background: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible, .clip:focus-visible, .num:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
select { background: var(--field); border: 1px solid var(--line); border-radius: 0; height: 22px; padding: 0 2px; }
#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; min-width: 0; }

/* Menüleiste */
#menubar { display: flex; align-items: stretch; height: 24px; background: var(--field); border-bottom: 1px solid var(--line); padding: 0 6px; position: relative; z-index: 50; overflow-x: auto; overflow-y: visible; scrollbar-width: none; }
#menubar > button { height: 23px; border: 0; background: transparent; padding: 0 10px; font-weight: 600; }
#menubar > button.brand { font-weight: 700; letter-spacing: .04em; }
#menubar > button:hover, #menubar > button.open { background: var(--ink); color: var(--field); }
.menu { position: fixed; z-index: 60; min-width: 250px; background: var(--field); border: 1px solid var(--ink); padding: 3px 0; }
.menu button { display: flex; width: 100%; height: 22px; border: 0; background: transparent; text-align: left; padding: 0 12px 0 22px; gap: 18px; position: relative; }
.menu button span:first-child { flex: 1; }
.menu button .sc { color: var(--dim); font-family: var(--mono); font-size: 11px; }
.menu button.chk::before { content: "✓"; position: absolute; left: 7px; }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--accent); outline: none; }
.menu button:disabled { color: var(--hair); cursor: default; }
.menu hr { border: 0; border-top: 1px solid var(--hair); margin: 3px 0; }
#modal { position: fixed; inset: 0; z-index: 80; background: rgba(28,28,26,.25); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal[hidden] { display: none; }
#modal .box { background: var(--panel); border: 1px solid var(--ink); width: min(520px, 100%); max-height: 90%; overflow: auto; }
#modal h2 { margin: 0; font-size: 13px; letter-spacing: .06em; background: var(--ink); color: var(--panel); padding: 5px 10px; }
#modal .body { padding: 12px 14px; line-height: 1.45; }
#modal .body table { border-collapse: collapse; width: 100%; }
#modal .body td { padding: 2px 6px; border-bottom: 1px solid var(--hair); }
#modal .body td:last-child { font-family: var(--mono); text-align: right; white-space: nowrap; }
#modal textarea { width: 100%; height: 140px; font: 11px var(--mono); background: var(--field); border: 1px solid var(--line); }
#modal .box.wide { width: min(980px, 100%); height: min(640px, 92%); display: flex; flex-direction: column; }
#modal .box.wide .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }
.pbtop { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pbtop input { height: 26px; width: 220px; border: 1px solid var(--line); background: var(--field); padding: 0 8px; }
.pbsub { color: var(--dim); font-size: 11px; flex: 1 1 260px; }
.pbwrap { flex: 1; min-height: 0; display: flex; gap: 8px; }
.pbcats { width: 190px; flex: none; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.pbcats button { display: flex; justify-content: space-between; text-align: left; height: 24px; }
.pbcats small, .pblist small { color: var(--dim); font-size: 9.5px; }
.pblist { flex: 1; min-width: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 3px; align-content: start; }
.pblist button { text-align: left; height: auto; min-height: 26px; padding: 3px 8px; display: flex; flex-direction: column; align-items: flex-start; }
.pblist button.on small, .pbcats button.on small { color: var(--ink); }
@media (max-width: 640px) { .pbwrap { flex-direction: column; } .pbcats { width: auto; flex-direction: row; flex-wrap: wrap; max-height: 110px; } }
.harmthemes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 6px; }
.harmthemes button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 6px 8px; height: auto; }
.harmthemes small { font: 10px var(--mono); opacity: .75; }
#modal .acts { display: flex; justify-content: flex-end; gap: 6px; padding: 0 14px 12px; }

/* Transport */
#top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.logo { font-weight: 700; font-size: 15px; letter-spacing: .06em; white-space: nowrap; }
.logo small { font-weight: 400; font-size: 11px; color: var(--dim); letter-spacing: .02em; margin-left: 6px; }
.grp { display: flex; align-items: center; gap: 4px; }
.grp > label { font-size: 10.5px; font-weight: 700; color: var(--dim); letter-spacing: .06em; margin-left: 4px; }
.tbtn { width: 30px; padding: 0; font-size: 13px; }
.num { min-width: 56px; height: 22px; padding: 2px 6px; background: var(--field); border: 1px solid var(--line); font-family: var(--mono); font-size: 12px; text-align: right; cursor: ns-resize; touch-action: none; user-select: none; }
.lcd { font-family: var(--mono); font-size: 13px; background: var(--ink); color: var(--accent); padding: 2px 8px; height: 22px; min-width: 96px; text-align: right; white-space: pre; }
.spacer { flex: 1; }
.views button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* Arrangement */
#main { min-height: 0; position: relative; }
#arr, #mix { position: absolute; inset: 0; display: flex; flex-direction: column; }
#arr[hidden], #mix[hidden] { display: none; }
#arrTools { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; padding: 4px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
#arrTools .hint { color: var(--dim); margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#arrScroll { flex: 1; overflow: auto; position: relative; background: var(--lane2); }
#arrInner { position: relative; user-select: none; }
.row { display: flex; height: 58px; border-bottom: 1px solid var(--hair); }
.row.ruler { height: 24px; position: sticky; top: 0; z-index: 4; border-bottom: 1px solid var(--line); }
.head { position: sticky; left: 0; z-index: 3; width: 210px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; grid-template-rows: 1fr 1fr; column-gap: 6px; padding: 4px 6px 4px 0; cursor: pointer; }
.row.sel .head { background: var(--field); }
.head .col { grid-row: 1 / 3; }
.head .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: center; }
.head .kd { color: var(--dim); font-size: 11px; align-self: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .bt { display: flex; gap: 2px; align-self: center; justify-content: flex-end; }
.head .bt button { height: 18px; min-width: 20px; padding: 0 4px; font-size: 10.5px; font-weight: 700; }
.head .bt button.m.on, .strip .bt button.m.on { background: var(--sel); }
.head .bt button.s.on, .strip .bt button.s.on { background: #6fb6f0; }
.head canvas.hm { align-self: center; justify-self: end; }
.corner { position: sticky; left: 0; z-index: 5; width: 210px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 5px 8px; color: var(--dim); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
#ruler { display: block; cursor: pointer; touch-action: none; }
.lane { position: relative; flex: none; height: 100%; }
.lane.empty::after { content: attr(data-hint); position: absolute; left: 12px; top: 20px; color: var(--dim); pointer-events: none; white-space: nowrap; }
.clip { position: absolute; top: 3px; bottom: 3px; border: 1px solid var(--ink); background: var(--field); overflow: hidden; cursor: grab; touch-action: none; }
.clip .ct { height: 14px; padding: 0 4px; font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--ink); }
.clip canvas { display: block; pointer-events: none; }
.clip.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
.clip.sel .ct { background: var(--ink) !important; color: var(--field); }
.clip .rs { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
.clip.missing { background: repeating-linear-gradient(45deg, var(--lane), var(--lane) 6px, var(--field) 6px, var(--field) 12px); }
#playhead { position: absolute; top: 0; width: 1px; background: var(--play); pointer-events: none; z-index: 2; }
#loopShade { position: absolute; top: 24px; background: rgba(255,148,25,.08); pointer-events: none; z-index: 1; border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); }

/* Detailbereich */
#detail { height: 236px; display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
#detail[hidden] { display: none; }
#device { border-right: 1px solid var(--line); padding: 8px 12px; overflow: auto; min-width: 0; }
#editor { padding: 8px 12px; overflow: auto; min-width: 0; }
.dtitle { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .06em; margin-bottom: 8px; white-space: nowrap; }
.dtitle .tag { background: var(--ink); color: var(--panel); padding: 1px 6px; }
.dtitle .sub { font-weight: 400; color: var(--dim); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
.kgrid { display: flex; flex-wrap: wrap; gap: 6px 4px; }
.kn { display: flex; flex-direction: column; align-items: center; width: 62px; }
.kn label { font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: .04em; white-space: nowrap; overflow: hidden; max-width: 100%; }
.kn canvas { cursor: ns-resize; touch-action: none; margin: 2px 0 1px; }
.kn .v { font-family: var(--mono); font-size: 10.5px; white-space: nowrap; }
.drow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.drow > span { font-size: 10.5px; font-weight: 700; color: var(--dim); letter-spacing: .04em; }
input[type=range] { accent-color: var(--accent); }
.tnote { color: var(--dim); font-size: 10.5px; max-width: 46ch; font-weight: 400 !important; letter-spacing: 0 !important; }
.empty-ed { color: var(--dim); padding: 24px 0; max-width: 60ch; }

/* Step-Editor im Clip */
.seqed { display: grid; grid-template-columns: 92px repeat(16, minmax(30px, 1fr)); min-width: 620px; }
.seqed .lab { font-size: 10.5px; font-weight: 700; color: var(--dim); letter-spacing: .04em; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding-right: 6px; }
.seqed .lab select { font-size: 10.5px; height: 20px; }
.seqed .cell { display: flex; flex-direction: column; align-items: center; border-left: 1px solid var(--hair); padding: 2px 0; }
.seqed .cell.b4 { border-left-color: var(--line); }
.seqed .kn { width: 100%; }
.cell.num, .dnum { font-family: var(--mono); font-size: 10.5px; color: var(--dim); text-align: center; padding: 0; }
.now { background: var(--accent); color: var(--ink) !important; }
.pad { width: calc(100% - 6px); height: 30px; padding: 0; border: 1px solid var(--ink); background: var(--field); font-family: var(--mono); font-size: 10px; }
.pad.on { background: var(--accent); }
.pad.v2 { background: #ffc779; }
.pad.now { outline: 2px solid var(--ink); outline-offset: -4px; }
.pad:hover { background: var(--sel); }
.drumed { display: grid; grid-template-columns: 92px repeat(16, minmax(26px, 1fr)); row-gap: 3px; min-width: 560px; }
.drumed .lab { font-weight: 700; font-size: 11px; display: flex; align-items: center; cursor: pointer; }
.drumed .lab:hover { color: var(--accent); }
.drumed .pad { height: 18px; justify-self: center; }
.audioed canvas { display: block; width: 100%; height: 110px; background: var(--field); border: 1px solid var(--line); margin-top: 8px; }

/* Instrument-Bedienfeld */
#inst { position: absolute; inset: 0; display: flex; flex-direction: column; }
#inst[hidden] { display: none; }
#instScroll { flex: 1; overflow: auto; padding: 10px 12px 16px; background: var(--bg); }
.jtop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px; }
.jbrand { font-weight: 700; font-size: 20px; letter-spacing: .14em; white-space: nowrap; }
.jbrand small { display: block; font-size: 10.5px; letter-spacing: .1em; color: var(--dim); font-weight: 600; }
.jpatch { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.jpatch > span { font-size: 9.5px; font-weight: 700; color: var(--dim); letter-spacing: .08em; margin: 0 4px 0 8px; }
.jlcd { font-family: var(--mono); background: var(--ink); color: #ff5a3c; padding: 0 10px; height: 24px; min-width: 180px; line-height: 24px; white-space: nowrap; overflow: hidden; }
.jnum { width: 26px; height: 24px; padding: 0; font-weight: 700; }
.jpatch input { height: 24px; width: 130px; border: 1px solid var(--line); background: var(--field); padding: 0 6px; }
.jp { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.jsec { border: 1px solid var(--ink); background: var(--panel); display: flex; flex-direction: column; }
.jsec h3 { margin: 0; font-size: 10.5px; letter-spacing: .14em; padding: 3px 8px; background: var(--ink); color: var(--field); border-bottom: 4px solid var(--c); white-space: nowrap; }
.jbody { display: flex; gap: 6px; padding: 8px; align-items: flex-start; flex: 1; }
.vs { width: 36px; display: flex; flex-direction: column; align-items: center; }
.vs label { font-size: 9.5px; font-weight: 700; color: var(--dim); white-space: nowrap; height: 13px; }
.vs canvas { cursor: ns-resize; touch-action: none; margin: 3px 0; }
.vs .v { font-family: var(--mono); font-size: 9.5px; white-space: nowrap; }
.swg { display: flex; flex-direction: column; gap: 3px; }
.swg > b { font-size: 9.5px; color: var(--dim); letter-spacing: .06em; height: 13px; white-space: nowrap; }
.jp .swb, .jp .swb.on, .jp .swb:hover { height: 19px; display: flex; align-items: center; gap: 5px; padding: 0 6px 0 5px; font-size: 10px; font-weight: 700; background: var(--c); border: 1px solid var(--ink); color: var(--ink); }
.swb i { width: 8px; height: 6px; background: #5a1c14; flex: none; border: 1px solid var(--ink); }
.swb.on i { background: #ff2a1a; }
.jkeys { position: relative; height: 72px; margin-top: 10px; max-width: 760px; user-select: none; touch-action: none; }
.jkeys button { position: absolute; top: 0; padding: 0; border: 1px solid var(--ink); }
.jkeys .w { height: 72px; background: var(--field); }
.jkeys .b { height: 44px; background: var(--ink); z-index: 1; }
.jkeys button.dn { background: var(--accent); }

/* TRENDY RHYTHM */
.rsec { margin: 14px 0 6px; font-size: 11px; letter-spacing: .16em; border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
.rkits { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 4px; margin-bottom: 8px; }
.rkit { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; height: auto; padding: 5px 8px 5px 12px; text-align: left; border: 1px solid var(--ink); background: var(--panel); box-shadow: inset 6px 0 0 var(--c); }
.rkit b { font-size: 12px; letter-spacing: .08em; } .rkit span { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.rkit.on, .rkit.on:hover { background: var(--c); } .rkit.on span { color: var(--ink); }
.rlanes .jbody { padding: 6px; gap: 4px; }
.rsl { display: flex; gap: 2px; }
.vs.n { width: 28px; } .vs.n label, .vs.n .v { font-size: 9px; }
.rpad { height: 26px; padding: 0; border: 1px solid var(--ink); background: var(--field); font-size: 10px; }
.rpad.on, .rpad:active { background: var(--accent); }
.rdrum { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.rcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; flex: 1 1 480px; min-width: 0; }
.rcard { display: flex; gap: 8px; align-items: center; height: auto; padding: 6px; text-align: left; border: 1px solid var(--ink); background: var(--panel); }
.rcard.on, .rcard.on:hover { background: var(--accent); }
.rcard b { display: block; font-size: 12.5px; } .rcard span { display: block; font-size: 10.5px; } .rcard small { display: block; font-size: 9.5px; color: var(--dim); letter-spacing: .06em; }
.rcard.on small { color: var(--ink); }
.rav { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: var(--ink); }
.rctl { border: 1px solid var(--ink); background: var(--panel); padding: 8px; flex: 0 1 560px; min-width: 0; }
.rctl.compact { border: 0; background: none; padding: 0; }
.rctl p { margin: 0; color: var(--dim); max-width: 46ch; }
.rhead { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; }
.rhead > div:nth-child(2) { flex: 1 1 200px; min-width: 0; }
.rtext { color: var(--dim); font-size: 11px; max-width: 60ch; }
.rrow { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.xy { cursor: crosshair; touch-action: none; display: block; }
.rparts { display: flex; flex-direction: column; gap: 4px; }
.rparts button { text-align: left; }

/* FX-Station */
#fx { position: absolute; inset: 0; display: flex; flex-direction: column; }
#fx[hidden] { display: none; }
#fxScroll { flex: 1; overflow: auto; padding: 10px 12px 16px; background: var(--bg); }
.fxtabs { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-bottom: 6px; }
.fxlab { font-size: 9.5px; font-weight: 700; color: var(--dim); letter-spacing: .1em; margin: 0 4px 0 8px; }
.fxlab:first-child { margin-left: 0; }
.fxtab { box-shadow: inset 0 -4px 0 var(--c); display: flex; gap: 5px; align-items: center; }
.fxtab.on, .fxtab.on:hover { background: var(--c); }
.fxtab small { background: var(--ink); color: var(--field); padding: 0 4px; font-size: 9.5px; }
.fxrack { margin-top: 8px; align-items: flex-start; }
.fxu h3, .fxadd h3 { display: flex; align-items: center; gap: 6px; }
.fxu h3 span { flex: 1; }
.fxu.off .fxb { opacity: .45; }
.fxled { width: 14px; height: 10px; padding: 0; border: 1px solid var(--field); background: #5a1c14; }
.fxled.on, .fxled.on:hover { background: #ff2a1a; }
.fxsm { height: 16px; min-width: 18px; padding: 0 3px; font-size: 10px; background: var(--ink); color: var(--field); border: 1px solid var(--dim); }
.fxb { flex-wrap: wrap; max-width: 420px; gap: 6px 2px; }
.fxb .swb, .fxb .swb.on, .fxb .swb:hover { height: 19px; display: flex; align-items: center; gap: 5px; padding: 0 6px 0 5px; font-size: 10px; font-weight: 700; background: var(--c); border: 1px solid var(--ink); color: var(--ink); }
.fxsel { height: 22px; font-size: 10.5px; }
.fxaddg { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 3px; padding: 8px; }
.fxaddg button { text-align: left; box-shadow: inset 5px 0 0 var(--c); padding-left: 10px; font-size: 10.5px; font-weight: 700; }
.fxbtn { width: 88px; height: 20px; padding: 0 3px; font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Mischpult */
#mix { background: var(--bg); }
#strips { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; min-height: 0; }
.strip { width: 100px; flex: none; display: flex; flex-direction: column; align-items: center; border-right: 1px solid var(--line); background: var(--panel); padding-bottom: 8px; min-height: 0; }
.strip.sel { background: var(--field); }
.strip.ret { background: #cdd3d4; }
.strip.mst { background: #dccfbd; width: 128px; }
.strip.gap { width: 12px; background: var(--bg); }
.strip .sn { width: 100%; padding: 5px 6px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; border-bottom: 1px solid var(--ink); cursor: pointer; }
.strip .st { font-size: 10.5px; color: var(--dim); margin: 3px 0; white-space: nowrap; }
.strip .sec { width: 100%; border-top: 1px solid var(--hair); padding-top: 3px; margin-top: 3px; display: flex; justify-content: center; flex-wrap: wrap; gap: 0 2px; }

      const v = c.lanes[k][i], p = el("button", "pad" + (v >= .9 ? " on" : v > 0 ? " v2" : ""), g, ""); p.setAttribute("aria-label", name + " Schritt " + (i + 1));

function audioEditor(ed, tr, c) {

  knob(r, { label: "TONHÖHE", bip: true, def: .5, steps: () => 48, get: () => ((c.semis || 0) + 24) / 48, set: v => { c.semis = Math.round(v * 48 - 24); save(); redraw(); }, fmt: () => (c.semis > 0 ? "+" : "") + (c.semis || 0) + " HT" });
  knob(r, { label: "START", def: 0, get: () => (c.offset || 0) / b.buf.duration, set: v => { c.offset = v * b.buf.duration; save(); redraw(); }, fmt: () => (c.offset || 0).toFixed(2).replace(".", ",") + " s" });

function renderEditorNow(step) {

/* ================= Mischpult ================= */
const meters = [];
function renderMixer() {
  const box = $("strips"); box.innerHTML = ""; meters.length = 0;
  P.tracks.forEach(tr => strip(box, tr, "trk"));

}
function strip(box, st, type) {
  const isTrack = type === "trk";

  const n = el("div", "sn", s); n.textContent = st.name; n.style.background = isTrack ? st.color : type === "ret" ? "#a9c3cf" : "#d9b98a";
  if (isTrack) { n.onclick = () => select(st.id, null); n.ondblclick = () => rename(st, n); n.title = "Klick: auswählen, Doppelklick: umbenennen"; }
  el("div", "st", s, isTrack ? instName(st) : type === "ret" ? "Rückweg" : "Summe");
  const eq = el("div", "sec", s, "<b>EQ</b>");
  const dbf = v => (v > 0 ? "+" : "") + Math.round(v);
  chKnob(eq, st, "hi", "HOCH", -15, 15, () => dbf(st.hi), isTrack); chKnob(eq, st, "mid", "MITTE", -15, 15, () => dbf(st.mid), isTrack); chKnob(eq, st, "lo", "TIEF", -15, 15, () => dbf(st.lo), isTrack);
  if (isTrack) { const se = el("div", "sec", s, "<b>SENDS</b>"); chKnob(se, st, "sA", "A", 0, 1, () => Math.round(st.sA * 100) + "", true); chKnob(se, st, "sB", "B", 0, 1, () => Math.round(st.sB * 100) + "", true); }
  const fxs = el("div", "sec", s, "<b>FX</b>"), fxb = el("button", "fxbtn" + ((st.fx || []).length ? " on" : ""), fxs);
  fxb.textContent = (st.fx || []).length ? (st.fx || []).map(f => FX_SHORT[f.type] || "?").slice(0, 2).join(" ") + ((st.fx.length > 2) ? " +" + (st.fx.length - 2) : "") : "+ Effekt";
  fxb.title = "Effekt-Station öffnen"; fxb.onclick = () => openFx(st);
  const pn = el("div", "sec", s, "<b>PAN</b>");
  chKnob(pn, st, "pan", "", -1, 1, () => st.pan === 0 ? "C" : (st.pan < 0 ? "L" : "R") + Math.round(Math.abs(st.pan) * 50), isTrack, 30);
  const fz = el("div", "fz", s);
  const fc = el("canvas", "", fz), mc = el("canvas", "", fz);
  fc.tabIndex = 0; fc.setAttribute("role", "slider"); fc.setAttribute("aria-label", "Lautstärke " + st.name);
  const db = el("div", "db", s);
  const bt = el("div", "bt", s);
  const m = el("button", "m" + (st.mute ? " on" : ""), bt, "M"); m.title = "Stumm"; m.setAttribute("aria-pressed", st.mute);
  m.onclick = () => { st.mute = !st.mute; applyAll(); renderMixer(); renderArr(); save(); };
  if (isTrack) { const so = el("button", "s" + (st.solo ? " on" : ""), bt, "S"); so.title = "Solo"; so.setAttribute("aria-pressed", st.solo); so.onclick = () => { st.solo = !st.solo; applyAll(); renderMixer(); renderArr(); save(); }; }
  const F = { st, fz, fc, mc, db, h: 0, g: null, mg: null };
  F.draw = () => {
    const h = F.h, w = 42, g = F.g; if (!g || h < 20) return;
    g.clearRect(0, 0, w, h);
    const top = 10, bot = h - 10, len = bot - top, y = bot - st.vol * len;
    g.strokeStyle = css("--line"); g.lineWidth = 1; g.fillStyle = css("--dim"); g.font = "9px " + css("--mono"); g.textAlign = "right"; g.textBaseline = "middle";
    [[1, "+6"], [.8, "0"], [.635, "−6"], [.504, "−12"], [.318, "−24"], [.126, "−48"], [0, "∞"]].forEach(([p, t]) => { const yy = Math.round(bot - p * len) + .5; g.beginPath(); g.moveTo(23, yy); g.lineTo(28, yy); g.stroke(); g.fillText(t, 21, yy); });
    g.fillStyle = css("--ink"); g.fillRect(33, top, 2, len);
    g.fillStyle = css("--field"); g.strokeStyle = css("--ink"); g.fillRect(27.5, y - 10.5, 13, 21); g.strokeRect(27.5, y - 10.5, 13, 21);
    g.fillStyle = css("--accent"); g.fillRect(28, y - 1, 12, 2);
    db.textContent = dbText(st.vol) + " dB";
  };
  let sy = 0, sv = 0;
  const set = v => { st.vol = clamp(v, 0, 1); if (Math.abs(st.vol - .8) < .006) st.vol = .8; if (A.ctx) applyChannel(st, isTrack); F.draw(); save(); };
  fc.addEventListener("pointerdown", e => { fc.setPointerCapture(e.pointerId); sy = e.clientY; sv = st.vol; e.preventDefault(); });
  fc.addEventListener("pointermove", e => { if (fc.hasPointerCapture(e.pointerId)) set(sv - (e.clientY - sy) / Math.max(40, F.h - 20) * (e.shiftKey ? .2 : 1)); });
  fc.addEventListener("dblclick", () => set(.8));
  fc.addEventListener("wheel", e => { e.preventDefault(); set(st.vol - Math.sign(e.deltaY) * .01); }, { passive: false });
  fc.addEventListener("keydown", e => { if (e.key === "ArrowUp") { set(st.vol + .01); e.preventDefault(); } if (e.key === "ArrowDown") { set(st.vol - .01); e.preventDefault(); } });

}
function layoutMeters() {
  for (const F of meters) {
    const h = Math.max(40, F.fz.clientHeight - 6);
    if (h === F.h && F.g) continue;
    F.h = h; F.g = setupCanvas(F.fc, 42, h); F.mg = setupCanvas(F.mc, 16, h); F.draw();
  }
}
function readPeak(ch, k) {
  const a = k ? ch.aR : ch.aL; a.getFloatTimeDomainData(ch.buf); let m = 0; for (let i = 0; i < ch.buf.length; i++) { const x = Math.abs(ch.buf[i]); if (x > m) m = x; }
  const now = performance.now();
  ch.peak[k] = Math.max(m, ch.peak[k] * .88);
  if (m >= ch.hold[k] || now - ch.holdT[k] > 1500) { ch.hold[k] = m; ch.holdT[k] = now; }
  return ch.peak[k];
}
const levelPos = x => x <= 0 ? 0 : clamp((20 * Math.log10(x) + 60) / 66, 0, 1);
const meterCol = f => f > .91 ? css("--mR") : f > .76 ? css("--mY") : css("--mG");
function drawMeters() {
  if ($("mix").hidden) return;
  layoutMeters();
  for (const F of meters) {
    const g = F.mg, h = F.h; if (!g) continue;
    g.clearRect(0, 0, 16, h); g.fillStyle = css("--ink"); g.fillRect(0, 10, 16, h - 20);
    const ch = F.st._ch, len = h - 22, segs = Math.floor(len / 3);
    for (let k = 0; k < 2; k++) {
      const p = ch ? levelPos(readPeak(ch, k)) : 0, x = 1.5 + k * 7;
      for (let s = 0; s < segs; s++) { const f = s / segs; if (f >= p) break; g.fillStyle = meterCol(f); g.fillRect(x, h - 11 - (s + 1) * 3 + 1, 6, 2); }
      if (ch) { const hp = levelPos(ch.hold[k]); if (hp > .02) { g.fillStyle = hp > .91 ? css("--mR") : css("--field"); g.fillRect(x, h - 11 - hp * len, 6, 1.5); } }
    }
  }
}
function drawHeadMeters() {
  if ($("arr").hidden) return;
  for (const tr of P.tracks) {
    if (!tr._hm || !tr._ch) continue; const g = tr._hm.getContext("2d"); g.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    g.fillStyle = css("--ink"); g.fillRect(0, 0, 60, 6);
    const p = levelPos(Math.max(readPeak(tr._ch, 0), readPeak(tr._ch, 1))); g.fillStyle = meterCol(p); g.fillRect(1, 1, 58 * p, 4);
  }
}

/* ================= Anzeige, Ansichten ================= */
function updatePos(beat) {
  const st = Math.floor(beat * 4 + 1e-6), bar = Math.floor(st / 16) + 1, b = Math.floor(st / 4) % 4 + 1, s = st % 4 + 1;
  $("pos").textContent = String(bar).padStart(3) + "." + String(b).padStart(3) + "." + String(s).padStart(3);
}
function drawPlayhead() { const ph = $("playhead"); if (ph) ph.style.left = HEADW() + T.cur * P.ppb + "px"; }
let lastStep = -1;
function frame() {
  if (T.playing && A.ctx) {
    const now = A.ctx.currentTime - (A.ctx.outputLatency || A.ctx.baseLatency || 0); // Anzeige folgt dem, was gerade aus den Boxen kommt
    while (T.queue.length && T.queue[0].time <= now) { const q = T.queue.shift(); if (q.step !== lastStep) { lastStep = q.step; T.cur = q.step / 4; updatePos(T.cur); renderEditorNow(q.step); } }
    drawPlayhead();
  }
  if (A.ctx) { drawMeters(); drawHeadMeters(); }
  requestAnimationFrame(frame);
}
function setView(v) {
  $("arr").hidden = v !== "arr"; $("mix").hidden = v !== "mix"; $("inst").hidden = v !== "inst"; $("fx").hidden = v !== "fx"; $("detail").hidden = v !== "arr" || !!P.hideDetail;
  [["vArr", "arr"], ["vMix", "mix"], ["vInst", "inst"], ["vFx", "fx"]].forEach(([id, k]) => { $(id).classList.toggle("on", v === k); $(id).setAttribute("aria-pressed", v === k); });
  if (v === "mix") { renderMixer(); requestAnimationFrame(layoutMeters); } else if (v === "inst") renderInst(); else if (v === "fx") renderFx(); else renderArr();
  try { localStorage.setItem("trendy-studio-view", v); } catch (e) {}
}

/* ================= Start ================= */
const NF = {};

  $("sRoot").value = P.root; $("sScale").value = P.scale; $("sSnap").value = String(P.snap);
  $("bLoop").classList.toggle("on", P.loop.on); $("bMetro").classList.toggle("on", P.metro); $("bHarm").classList.toggle("on", harmCfg().on);
  $("detail").hidden = $("arr").hidden || !!P.hideDetail;
}
P = demoProject();
load();
(function init() {
  KEYS.forEach((k, i) => el("option", "", $("sRoot"), k).value = i);
  SCALES.forEach((s, i) => el("option", "", $("sScale"), s[0]).value = i);
  $("sRoot").value = P.root; $("sScale").value = P.scale; $("sSnap").value = String(P.snap);
  const reKey = () => { save(); renderArr(); renderEditor(); };
  $("sRoot").onchange = () => { P.root = +$("sRoot").value; reKey(); };
  $("sScale").onchange = () => { P.scale = +$("sScale").value; reKey(); };
  $("sSnap").onchange = () => { P.snap = +$("sSnap").value; save(); };
  NF.bpm = numField($("nBpm"), { get: () => P.bpm, set: v => { P.bpm = v; applyAll(); save(); }, min: 40, max: 240, step: 1, fmt: v => v.toFixed(2).replace(".", ",") });
  NF.swing = numField($("nSwing"), { get: () => P.swing, set: v => { P.swing = v; save(); }, min: 50, max: 75, step: 1, fmt: v => v + " %" });
  $("bPlay").onclick = play; $("bStop").onclick = stop;
  $("bLoop").classList.toggle("on", P.loop.on); $("bMetro").classList.toggle("on", P.metro);
  $("bLoop").onclick = () => { P.loop.on = !P.loop.on; $("bLoop").classList.toggle("on", P.loop.on); save(); renderArr(); };
  $("bMetro").onclick = () => { P.metro = !P.metro; $("bMetro").classList.toggle("on", P.metro); save(); };
  $("bMidi").onclick = enableMidi; $("bHarm").onclick = harmBox; $("bHarm").classList.toggle("on", harmCfg().on);
  $("vArr").onclick = () => setView("arr"); $("vMix").onclick = () => setView("mix"); $("vInst").onclick = () => setView("inst"); $("vFx").onclick = () => setView("fx");
  $("bFull").onclick = () => { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (d.requestFullscreen) d.requestFullscreen().catch(() => toast("Vollbild ist hier nicht erlaubt.")); else toast("Vollbild ist hier nicht erlaubt."); };
  $("addSynth").onclick = () => addTrack("synth"); $("addPlanet").onclick = () => addTrack("planet"); $("addDrum").onclick = () => addTrack("drum"); $("addDrummer").onclick = () => addTrack("drummer"); $("addAudio").onclick = () => addTrack("audio");
  $("zIn").onclick = () => { P.ppb = Math.min(80, Math.round(P.ppb * 1.4)); save(); renderArr(); };
  $("zOut").onclick = () => { P.ppb = Math.max(5, Math.round(P.ppb / 1.4)); save(); renderArr(); };
  addEventListener("keydown", e => {
    if (!$("modal").hidden) { if (e.key === "Escape") closeModal(); return; }

    if (handleShortcut(e)) closeMenu();
  });
  addEventListener("resize", () => { if (!$("mix").hidden) layoutMeters(); });
  document.addEventListener("dragover", e => e.preventDefault()); document.addEventListener("drop", e => e.preventDefault());
  const first = P.tracks.find(t => t.kind === "synth");

  buildMenubar(); syncTop(); hist.last = JSON.stringify(P, strip_);
  renderArr(); renderMixer(); renderDevice(); renderEditor(); updatePos(0);
  let v = "arr"; try { v = localStorage.getItem("trendy-studio-view") || "arr"; } catch (e) {}
  if (v === "mix" || v === "inst" || v === "fx") setView(v);
  requestAnimationFrame(frame);
})();
